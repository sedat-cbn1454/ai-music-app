<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Music Studio</title>
    <meta name="theme-color" content="#0d0d11">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d0d11; color: #ffffff; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: #16161e; border-radius: 20px; padding: 24px; border: 1px solid #27273a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        label { font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        textarea, select { width: 100%; background: #0d0d11; border: 1px solid #27273a; border-radius: 12px; color: #fff; padding: 14px; margin-bottom: 18px; outline: none; }
        .btn { width: 100%; background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .player-card { display: none; text-align: center; margin-top: 20px; background: #16161e; border-radius: 20px; padding: 20px; border: 1px solid #27273a; }
        audio { width: 100%; margin-top: 15px; }
        .download-btn { display: block; width: 100%; margin-top: 15px; padding: 14px; background: #10b981; color: #fff; text-decoration: none; border-radius: 12px; font-weight: bold; text-align: center; }
        .status { text-align: center; color: #ec4899; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>AI MUSIC STUDIO</h1></header>
        <div class="card">
            <label>Müzik Tarzı</label>
            <textarea id="prompt" rows="4" placeholder="Örn: Dark R&B, slow tempo, deep bass, lead synth, emotional melody..."></textarea>
            <label>Süre</label>
            <select id="duration"><option value="15">15 Saniye</option><option value="30">30 Saniye</option></select>
            <button class="btn" id="generateBtn" onclick="generateMusic()">MÜZİK OLUŞTUR</button>
            <div class="status" id="statusText">⚡ AI müzik sentezliyor... Lütfen bekleyin.</div>
        </div>
        <div class="player-card" id="playerCard">
            <audio id="audioPlayer" controls></audio>
            <a id="downloadLink" class="download-btn" download="ai_music.wav">📥 Şarkıyı İndir</a>
        </div>
    </div>
    <script>
        const API_URL = "https://manager-muscular-linoleum.ngrok-free.dev"; 
        const API_KEY = "OZEL_GUVENLIK_ANAHTARIM_123";
        async function generateMusic() {
            const btn = document.getElementById("generateBtn");
            const status = document.getElementById("statusText");
            const playerCard = document.getElementById("playerCard");
            btn.disabled = true; status.style.display = "block"; playerCard.style.display = "none";
            try {
                const response = await fetch(`${API_URL}/api/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-API-Key": API_KEY, "ngrok-skip-browser-warning": "true" },
                    body: JSON.stringify({ prompt: document.getElementById("prompt").value, duration: parseInt(document.getElementById("duration").value) })
                });
                const data = await response.json();
                if (response.ok) {
                    const audioUrl = `${API_URL}${data.download_url}`;
                    document.getElementById("audioPlayer").src = audioUrl;
                    document.getElementById("downloadLink").href = audioUrl;
                    playerCard.style.display = "block";
                } else { alert("Hata: " + data.detail); }
            } catch (err) { alert("Sunucuya bağlanılamadı!"); } finally { btn.disabled = false; status.style.display = "none"; }
        }
    </script>
</body>
</html>
